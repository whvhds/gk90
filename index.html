<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta content="default-src 'none'; style-src * 'unsafe-inline'; script-src * 'unsafe-inline'; img-src * data: blob:; font-src * data:; media-src * data: blob:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'" http-equiv="Content-Security-Policy"/>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>考公任务速览 - 90天冲刺计划</title>
    <!-- Tailwind CSS -->
    <script src="https://image.uc.cn/s/uae/g/3n/mos-production/0915/3.4.17.js">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        darkbg: '#0f172a',
                        darkcard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <script src="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/js/all.min.js">
    </script>
    <link href="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/css/fontawesome.min.css" rel="stylesheet"/>
    <!-- ECharts -->
    <script src="https://image.uc.cn/s/uae/g/3n/mos-production/cdn-staticfile-net/echarts/5.4.3/echarts.min.js">
    </script>
    <style>
        /* Custom Scrollbar hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Checkbox styling */
        .custom-checkbox:checked+div {
            text-decoration: line-through;
            color: #9ca3af;
        }

        /* Dark mode transitions */
        body {
            transition: background-color 0.3s, color 0.3s;
        }

        /* Toast Animation */
        @keyframes slideInDown {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 20px);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }
        .toast-enter {
            animation: slideInDown 0.3s forwards;
        }
        .toast-exit {
            animation: fadeOut 0.3s forwards;
        }

        /* Task action buttons */
        .task-action-btn {
            opacity: 0.4;
            transition: opacity 0.2s, color 0.2s;
        }
        .task-item:hover .task-action-btn {
            opacity: 1;
        }

        /* Add task button */
        .add-task-btn {
            transition: all 0.2s;
        }
        .add-task-btn:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        .add-task-btn:hover i {
            color: #3b82f6;
        }

        /* Modal overlay */
        .modal-overlay {
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkbg dark:text-gray-100 h-screen flex flex-col overflow-hidden font-sans">
    <!-- Toast Container -->
    <div class="fixed top-0 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none" id="toast-container"></div>

    <!-- Header -->
    <header class="bg-white dark:bg-darkcard shadow-sm z-10 flex-none">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="text-lg font-bold tracking-wide">考公速览</h1>
            <div class="flex items-center space-x-3">
                <button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition" id="theme-toggle">
                    <i class="fas fa-moon dark:hidden text-gray-600"></i>
                    <i class="fas fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
                <button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition" id="settings-btn">
                    <i class="fas fa-cog text-gray-600 dark:text-gray-300"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto no-scrollbar relative bg-gray-50 dark:bg-darkbg w-full max-w-md mx-auto">
        <!-- Countdown Section -->
        <section class="bg-white dark:bg-darkcard py-3 shadow-sm mb-2 flex-none" id="countdown-section">
            <div class="px-4">
                <div class="flex space-x-3 overflow-x-auto no-scrollbar pb-1" id="countdown-container">
                    <!-- Countdown items injected by JS -->
                </div>
            </div>
        </section>

        <!-- View: Today -->
        <section class="view-section px-4 pb-20 hidden" id="view-today">
            <div class="flex justify-between items-end mb-2 mt-2">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900 dark:text-white" id="today-date-title">今日计划</h2>
                    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1" id="today-day-count">第 1 天</p>
                </div>
                <div class="text-right flex items-center gap-2">
                    <span class="text-xs font-semibold bg-blue-100 text-blue-800 px-2 py-1 rounded dark:bg-blue-900 dark:text-blue-200" id="current-stage-badge">基础重塑</span>
                    <!-- 导出按钮 -->
                    <button id="export-today-btn" class="text-xs bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 px-3 py-1 rounded-full transition" title="导出今日计划">
                        <i class="fas fa-file-export mr-1"></i>导出
                    </button>
                </div>
            </div>
            <!-- 今日进度条 -->
            <div class="mb-3 flex items-center gap-2">
                <span class="text-xs text-gray-500 dark:text-gray-400" id="today-progress-label">进度 0%</span>
                <div class="flex-1 bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                    <div class="bg-primary h-2 rounded-full" id="today-progress-bar" style="width:0%"></div>
                </div>
            </div>
            <!-- Daily Tip -->
            <div class="bg-yellow-50 dark:bg-yellow-900/20 border-l-4 border-yellow-400 p-3 mb-4 rounded-r text-sm text-yellow-800 dark:text-yellow-200" id="daily-tip">
                <!-- Tip injected by JS -->
            </div>
            <!-- Task List -->
            <div class="space-y-4" id="today-task-list">
                <!-- Tasks injected by JS -->
            </div>
            <!-- Note Area -->
            <div class="mt-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">今日备注</label>
                <textarea class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-darkcard focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none text-sm transition" id="daily-note" placeholder="记录错题数量、心得体会..." rows="3"></textarea>
            </div>
        </section>

        <!-- View: Calendar -->
        <section class="view-section px-4 pb-20 hidden" id="view-calendar">
            <div class="bg-white dark:bg-darkcard rounded-xl shadow-sm p-4 mt-4">
                <div class="flex justify-between items-center mb-4">
                    <button class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full" id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <h2 class="text-lg font-bold" id="calendar-month-title">2026年 7月</h2>
                    <button class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full" id="next-month"><i class="fas fa-chevron-right"></i></button>
                </div>
                <!-- Weekdays -->
                <div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-400 mb-2">
                    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
                </div>
                <!-- Days Grid -->
                <div class="grid grid-cols-7 gap-y-2 gap-x-1 text-center text-sm" id="calendar-grid">
                    <!-- Days injected by JS -->
                </div>
            </div>
            <!-- Selected Date Tasks -->
            <div class="mt-6 hidden" id="selected-date-tasks-container">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-lg font-bold border-l-4 border-primary pl-3" id="selected-date-title">7月22日 任务</h3>
                    <button class="text-xs text-primary hover:text-blue-700 font-medium flex items-center gap-1 add-task-btn-calendar px-2 py-1 rounded border border-dashed border-gray-300 dark:border-gray-600 hover:border-primary transition">
                        <i class="fas fa-plus text-xs"></i> 添加

                </div>
                <div class="space-y-3" id="selected-date-task-list">
                    <!-- Tasks for selected date -->
                </div>
            </div>
        </section>

        <!-- View: Cockpit -->
        <section class="view-section px-4 pb-20 hidden" id="view-cockpit">
            <h2 class="text-xl font-bold mb-4 mt-4">学情驾驶舱</h2>
            <!-- Progress Card -->
            <div class="bg-white dark:bg-darkcard rounded-xl shadow-sm p-4 mb-4">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">总体进度</h3>
                <div class="flex items-center justify-between mb-2">
                    <span class="text-3xl font-bold text-primary" id="progress-percentage">0%</span>
                    <span class="text-xs text-gray-500 dark:text-gray-400" id="progress-days-text">0/90 天</span>
                </div>
                <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
                    <div class="bg-primary h-2.5 rounded-full" id="progress-bar" style="width: 0%"></div>
                </div>
            </div>
            <!-- Chart Card -->
            <div class="bg-white dark:bg-darkcard rounded-xl shadow-sm p-4 mb-4">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">阶段分析</h3>
                <div id="echarts-stage" style="width: 100%; height: 200px;"></div>
            </div>
            <!-- Badges Card -->
            <div class="bg-white dark:bg-darkcard rounded-xl shadow-sm p-4">
                <h3 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3">成就徽章</h3>
                <div class="grid grid-cols-4 gap-4" id="badge-grid">
                    <!-- Badges injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white dark:bg-darkcard border-t border-gray-200 dark:border-gray-700 flex-none z-20">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-primary" data-target="view-today">
                <i class="fas fa-calendar-check text-xl mb-1"></i>
                <span class="text-xs">今日</span>
            </button>
            <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300" data-target="view-calendar">
                <i class="fas fa-calendar-alt text-xl mb-1"></i>
                <span class="text-xs">日历</span>
            </button>
            <button class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300" data-target="view-cockpit">
                <i class="fas fa-chart-pie text-xl mb-1"></i>
                <span class="text-xs">驾驶舱</span>
            </button>
        </div>
    </nav>

    <!-- Settings Modal -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 modal-overlay" id="settings-modal">
        <div class="bg-white dark:bg-darkcard rounded-xl w-full max-w-sm shadow-2xl overflow-hidden transform transition-all">
            <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                <h3 class="font-bold text-lg">设置与数据</h3>
                <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" id="close-settings"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 space-y-4">
                <div>
                    <h4 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-2">数据管理</h4>
                    <div class="flex space-x-2">
                        <button class="flex-1 bg-blue-50 text-blue-600 py-2 rounded-lg text-sm font-medium hover:bg-blue-100 transition" id="export-btn">导出数据</button>
                        <button class="flex-1 bg-green-50 text-green-600 py-2 rounded-lg text-sm font-medium hover:bg-green-100 transition" id="import-btn">导入数据</button>
                        <input accept=".json" class="hidden" id="import-file" type="file"/>
                    </div>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-red-500 mb-2">危险区域</h4>
                    <button class="w-full bg-red-50 text-red-600 py-2 rounded-lg text-sm font-medium hover:bg-red-100 transition" id="reset-btn">重置所有进度</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Task Add/Edit Modal -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 modal-overlay" id="task-modal">
        <div class="bg-white dark:bg-darkcard rounded-xl w-full max-w-sm shadow-2xl overflow-hidden transform transition-all">
            <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                <h3 class="font-bold text-lg" id="task-modal-title">添加任务</h3>
                <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" id="close-task-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 space-y-4">
                <input type="hidden" id="task-modal-date"/>
                <input type="hidden" id="task-modal-index" value="-1"/>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">标签</label>
                    <input class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-darkcard focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-sm" id="task-modal-tag" placeholder="如：行测-资料分析" list="tag-suggestions"/>
                    <datalist id="tag-suggestions">
                        <!-- 预设常用标签 -->
                        <option value="行测-资料分析">
                        <option value="申论">
                        <option value="常识时政">
                        <option value="申论规范词积累">
                        <option value="复盘">
                        <option value="行测-言语理解">
                        <option value="行测-判断推理">
                        <option value="行测-数量关系">
                    </datalist>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">任务内容</label>
                    <textarea class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-darkcard focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none text-sm" id="task-modal-content" rows="3" placeholder="具体任务描述..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">目标（可选）</label>
                    <input class="w-full p-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-darkcard focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-sm" id="task-modal-goal" placeholder="如：做对的题≥60%"/>
                </div>
                <div class="flex space-x-2 pt-2">
                    <button class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 dark:hover:bg-gray-600 transition" id="task-modal-cancel">取消</button>
                    <button class="flex-1 bg-primary text-white py-2 rounded-lg text-sm font-medium hover:bg-blue-600 transition" id="task-modal-save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Template Modal -->
    <div class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4 modal-overlay" id="template-modal">
        <div class="bg-white dark:bg-darkcard rounded-xl w-full max-w-sm shadow-2xl overflow-hidden transform transition-all">
            <div class="px-4 py-3 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                <h3 class="font-bold text-lg">选择任务模板</h3>
                <button class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300" id="close-template-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4 space-y-2 max-h-80 overflow-y-auto" id="template-list">
                <!-- 模板项由JS生成 -->
            </div>
        </div>
    </div>

        // --- State Management ---
        let appState = {
            tasks: {}, // Key: "YYYY-MM-DD", Value: { tip: "", tasks: [{tag, content, goal, done}], note: "" }
            completedDays: [], // Array of "YYYY-MM-DD"
            lastVisitDate: null,
            theme: 'light'
        };

        // --- Helper Functions ---
        function getDateString(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function addDays(dateStr, days) {
            const date = new Date(dateStr);
            date.setDate(date.getDate() + days);
            return getDateString(date);
        }

        function diffDays(dateStr1, dateStr2) {
            const d1 = new Date(dateStr1);
            const d2 = new Date(dateStr2);
            const timeDiff = d2.getTime() - d1.getTime();
            return Math.ceil(timeDiff / (1000 * 3600 * 24));
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-gray-800');

            toast.className = `${bgClass} text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium toast-enter pointer-events-auto`;
            toast.innerText = message;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // --- Core Logic ---

        function initApp() {
            loadData();
            applyTheme();
            checkRollover();
            renderCountdowns();
            switchView('view-today');
            renderToday();

            // Listeners
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.target));
            });

            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
            document.getElementById('settings-btn').addEventListener('click', () => document.getElementById('settings-modal').classList.remove('hidden'));
            document.getElementById('close-settings').addEventListener('click', () => document.getElementById('settings-modal').classList.add('hidden'));

            // Calendar listeners
            document.getElementById('prev-month').addEventListener('click', () => changeMonth(-1));
            document.getElementById('next-month').addEventListener('click', () => changeMonth(1));

            // Data Management
            document.getElementById('export-btn').addEventListener('click', exportData);
            document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
            document.getElementById('import-file').addEventListener('change', importData);
            document.getElementById('reset-btn').addEventListener('click', resetData);

            // Note listener
            document.getElementById('daily-note').addEventListener('input', (e) => {
                const today = getDateString(new Date());
                if (!appState.tasks[today]) appState.tasks[today] = { tasks: [], note: "" };
                appState.tasks[today].note = e.target.value;
                saveData();
            });

            // Task Modal listeners
            document.getElementById('close-task-modal').addEventListener('click', closeTaskModal);
            document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
            document.getElementById('task-modal-save').addEventListener('click', saveTaskFromModal);
            document.getElementById('task-modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeTaskModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeTaskModal();
            });

            // Template Modal
            document.getElementById('close-template-modal').addEventListener('click', closeTemplateModal);
            document.getElementById('template-modal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeTemplateModal();
            });

            // 导出今日计划
            document.getElementById('export-today-btn').addEventListener('click', exportTodayPlan);

            // 添加模板按钮（在今日视图的"添加任务"按钮旁）
            // 动态添加，因为渲染时生成

        function loadData() {
            const saved = localStorage.getItem('gongkao_app_v1');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                    for (const date in appState.tasks) {
                        if (appState.tasks[date].tasks) {
                            appState.tasks[date].tasks.forEach(t => {
                                if (t.done === undefined) t.done = false;
                            });
                        }
                    }
                } catch (e) {
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
        }

        function initDefaultData() {
            const firstDay = START_DATE;
            appState.tasks = {};
            appState.tasks[firstDay] = JSON.parse(JSON.stringify(INITIAL_TASKS[firstDay]));
            appState.tasks[firstDay].note = "";
            appState.tasks[firstDay].tasks.forEach(t => t.done = false);
            appState.lastVisitDate = firstDay;
            appState.completedDays = [];
            appState.theme = 'light';
            saveData();
        }

        function saveData() {
            localStorage.setItem('gongkao_app_v1', JSON.stringify(appState));
        }

        function checkRollover() {
            const today = getDateString(new Date());
            if (appState.lastVisitDate && appState.lastVisitDate !== today) {
                if (!appState.tasks[today] || appState.tasks[today].tasks.length === 0) {
                    const yesterday = addDays(today, -1);
                    if (appState.tasks[yesterday] && appState.tasks[yesterday].tasks) {
                        const unfinishedTasks = appState.tasks[yesterday].tasks.filter(t => !t.done);
                        if (unfinishedTasks.length > 0) {
                            if (!appState.tasks[today]) appState.tasks[today] = { tasks: [], note: "" };
                            if (appState.tasks[today].tasks.length === 0) {
                                appState.tasks[today].tasks = JSON.parse(JSON.stringify(unfinishedTasks));
                                appState.tasks[today].tasks.forEach(t => t.done = false);
                                showToast(`已将 ${unfinishedTasks.length} 项未完成任务累积至今日`, 'info');
                            }
                        }
                    }
                }
            }
            appState.lastVisitDate = today;
            saveData();
        }

        function applyTheme() {
            if (appState.theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleTheme() {
            appState.theme = appState.theme === 'light' ? 'dark' : 'light';
            applyTheme();
            saveData();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.target === viewId) {
                    btn.classList.add('text-primary');
                    btn.classList.remove('text-gray-400', 'dark:text-gray-500');
                } else {
                    btn.classList.remove('text-primary');
                    btn.classList.add('text-gray-400', 'dark:text-gray-500');
                }
            });

            if (viewId === 'view-calendar') renderCalendar();
            if (viewId === 'view-cockpit') renderCockpit();
        }

        // --- Rendering: Today ---
        function renderToday() {
            const todayStr = getDateString(new Date());
            const dayNum = diffDays(START_DATE, todayStr) + 1;

            // Title
            document.getElementById('today-date-title').innerText = "今日计划";
            document.getElementById('today-day-count').innerText = `第 ${dayNum} 天`;

            // Stage
            let currentStage = STAGES[0];
            for (let s of STAGES) {
                if (dayNum <= s.endDay) {
                    currentStage = s;
                    break;
                }
            }
            document.getElementById('current-stage-badge').innerText = currentStage.name;

            // Data
            let dayData = appState.tasks[todayStr];

            if (!dayData) {
                if (INITIAL_TASKS[todayStr]) {
                    dayData = JSON.parse(JSON.stringify(INITIAL_TASKS[todayStr]));
                    dayData.tasks.forEach(t => t.done = false);
                    appState.tasks[todayStr] = dayData;
                    saveData();
                } else {
                    dayData = { tip: "坚持就是胜利，保持手感！", tasks: [], note: "" };
                    appState.tasks[todayStr] = dayData;
                }
            }

            // Tip
            document.getElementById('daily-tip').innerText = dayData.tip || "暂无提示";

            // Note
            document.getElementById('daily-note').value = dayData.note || "";

            // 更新今日进度条
            const total = dayData.tasks.length;
            const done = dayData.tasks.filter(t => t.done).length;
            const percent = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('today-progress-label').innerText = `进度 ${percent}%`;
            document.getElementById('today-progress-bar').style.width = `${percent}%`;

            // Tasks
            const listContainer = document.getElementById('today-task-list');
            listContainer.innerHTML = '';

            // --- 添加任务按钮 + 模板按钮 ---
            const btnWrapper = document.createElement('div');
            btnWrapper.className = "flex items-center gap-2 mb-3";

            const addBtn = document.createElement('button');
            addBtn.className = "add-task-btn flex-1 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg py-3 text-center cursor-pointer transition hover:border-primary hover:text-primary";
            addBtn.innerHTML = `<i class="fas fa-plus text-gray-400 mr-2 transition"></i><span class="text-gray-500 dark:text-gray-400 text-sm">添加任务</span>`;
            addBtn.addEventListener('click', () => openTaskModal(todayStr));
            btnWrapper.appendChild(addBtn);

            const templateBtn = document.createElement('button');
            templateBtn.className = "add-task-btn border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg py-3 px-4 cursor-pointer transition hover:border-primary hover:text-primary flex items-center gap-1";
            templateBtn.innerHTML = `<i class="fas fa-copy text-gray-400 transition"></i><span class="text-gray-500 dark:text-gray-400 text-sm hidden sm:inline">模板</span>`;
            templateBtn.title = "从模板添加任务";
            templateBtn.addEventListener('click', () => openTemplateModal(todayStr));
            btnWrapper.appendChild(templateBtn);

            listContainer.appendChild(btnWrapper);

            if (!dayData.tasks || dayData.tasks.length === 0) {
                const emptyHint = document.createElement('div');
                emptyHint.className = "text-center text-gray-400 dark:text-gray-500 text-sm py-6";
                emptyHint.innerText = "还没有任务，点击上方「添加任务」开始规划吧 ✨";
                listContainer.appendChild(emptyHint);
                return;
            }

            // Group by tag
            const grouped = {};
            dayData.tasks.forEach((task, idx) => {
                task._index = idx;
                if (!grouped[task.tag]) grouped[task.tag] = [];
                grouped[task.tag].push(task);
            });

            for (const [tag, tasks] of Object.entries(grouped)) {
                const tagDiv = document.createElement('div');
                tagDiv.className = "bg-white dark:bg-darkcard rounded-lg shadow-sm p-4 border-l-4 border-primary";

                const tagTitle = document.createElement('h3');
                tagTitle.className = "font-bold text-gray-800 dark:text-gray-200 mb-3 flex items-center";
                tagTitle.innerHTML = `<span class="w-2 h-2 rounded-full bg-primary mr-2"></span>${tag}`;
                tagDiv.appendChild(tagTitle);

                tasks.forEach((task) => {
                    const idx = task._index;
                    const taskItem = document.createElement('div');
                    taskItem.className = "mb-4 last:mb-0 task-item group";

                    const checkWrapper = document.createElement('label');
                    checkWrapper.className = "flex items-start space-x-3 cursor-pointer group";

                    const checkbox = document.createElement('input');
                    checkbox.type = "checkbox";
                    checkbox.className = "custom-checkbox mt-1 w-5 h-5 text-primary rounded border-gray-300 focus:ring-primary cursor-pointer flex-shrink-0";
                    checkbox.checked = task.done;
                    checkbox.onchange = (e) => toggleTask(todayStr, idx, e.target.checked);

                    const contentDiv = document.createElement('div');
                    contentDiv.className = "flex-1 transition-colors duration-200";
                    if (task.done) contentDiv.classList.add('text-gray-400', 'line-through');

                    const pContent = document.createElement('p');
                    pContent.className = "text-sm leading-relaxed text-gray-700 dark:text-gray-300";
                    pContent.innerText = task.content;

                    contentDiv.appendChild(pContent);

                    if (task.goal) {
                        const pGoal = document.createElement('p');
                        pGoal.className = "text-xs text-blue-500 dark:text-blue-400 mt-1 font-medium";
                        pGoal.innerText = `目标: ${task.goal}`;
                        contentDiv.appendChild(pGoal);
                    }

                    checkWrapper.appendChild(checkbox);
                    checkWrapper.appendChild(contentDiv);
                    taskItem.appendChild(checkWrapper);

                    // 操作按钮
                    const actionBar = document.createElement('div');
                    actionBar.className = "flex justify-end space-x-3 mt-1";

                    const editBtn = document.createElement('button');
                    editBtn.className = "task-action-btn text-gray-400 hover:text-blue-500 text-xs transition";
                    editBtn.innerHTML = '<i class="fas fa-edit"></i> 编辑';
                    editBtn.title = "编辑任务";
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        openTaskModal(todayStr, idx);
                    };

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = "task-action-btn text-gray-400 hover:text-red-500 text-xs transition";
                    deleteBtn.innerHTML = '<i class="fas fa-trash"></i> 删除';
                    deleteBtn.title = "删除任务";
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`确定要删除此任务吗？\n"${task.content.substring(0, 30)}${task.content.length > 30 ? '...' : ''}"`)) {
                            deleteTask(todayStr, idx);
                        }
                    };

                    actionBar.appendChild(editBtn);
                    actionBar.appendChild(deleteBtn);
                    taskItem.appendChild(actionBar);

                    tagDiv.appendChild(taskItem);
                });

                listContainer.appendChild(tagDiv);
            }
        }

        // --- Rendering: Countdown ---
        function renderCountdowns() {
            const container = document.getElementById('countdown-container');
            container.innerHTML = '';
            const today = new Date();

            EXAMS.forEach(exam => {
                const examDate = new Date(exam.date);
                const diff = Math.ceil((examDate - today) / (1000 * 3600 * 24));

                const div = document.createElement('div');
                div.className = "flex-none bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-lg p-3 min-w-[100px] shadow-md";
                div.innerHTML = `
                        <div class="text-xs opacity-80 mb-1 truncate">${exam.name}</div>
                        <div class="text-xl font-bold">${diff} <span class="text-xs font-normal">天</span></div>
                        <div class="text-[10px] opacity-70 mt-1">${exam.date.slice(5)}</div>
                    `;
                container.appendChild(div);
            });
        }

        // --- Rendering: Calendar ---
        let currentCalendarDate = new Date();
        let selectedCalendarDate = getDateString(new Date());

        function renderCalendar() {
            const year = currentCalendarDate.getFullYear();
            const month = currentCalendarDate.getMonth();

            document.getElementById('calendar-month-title').innerText = `${year}年 ${month + 1}月`;

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            const startDayOfWeek = (firstDay.getDay() + 6) % 7;
            const totalDays = lastDay.getDate();

            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            for (let i = 0; i < startDayOfWeek; i++) {
                grid.appendChild(document.createElement('div'));
            }

            const todayStr = getDateString(new Date());

            for (let d = 1; d <= totalDays; d++) {
                const dateStr = getDateString(new Date(year, month, d));
                const dayEl = document.createElement('div');
                dayEl.className =
                    "h-8 w-8 flex items-center justify-center rounded-full text-sm cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 mx-auto transition relative";

                if (dateStr === todayStr) {
                    dayEl.classList.add('bg-primary', 'text-white', 'hover:bg-primary');
                } else if (appState.tasks[dateStr] && appState.tasks[dateStr].tasks && appState.tasks[dateStr].tasks.length > 0 &&
                    appState.tasks[dateStr].tasks.every(t => t.done)) {
                    dayEl.classList.add('text-green-600', 'font-bold');
                } else if (appState.tasks[dateStr] && appState.tasks[dateStr].tasks && appState.tasks[dateStr].tasks.length > 0) {
                    dayEl.classList.add('text-blue-600', 'font-semibold');
                }

                dayEl.innerText = d;
                dayEl.onclick = () => showDateTasks(dateStr, dayEl);
                grid.appendChild(dayEl);
            }

            if (selectedCalendarDate) {
                const targetDate = new Date(selectedCalendarDate);
                if (targetDate.getMonth() === month && targetDate.getFullYear() === year) {
                    const dayNum = targetDate.getDate();
                    const idx = startDayOfWeek + dayNum - 1;
                    const allDays = grid.querySelectorAll('div');
                    if (allDays[idx]) {
                        allDays[idx].classList.add('ring-2', 'ring-offset-1', 'ring-primary');
                    }
                }
                showDateTasks(selectedCalendarDate);
            } else {
                selectedCalendarDate = todayStr;
                showDateTasks(todayStr);
            }
        }

        function changeMonth(delta) {
            currentCalendarDate.setMonth(currentCalendarDate.getMonth() + delta);
            renderCalendar();
        }

        function showDateTasks(dateStr, el) {
            selectedCalendarDate = dateStr;

            document.querySelectorAll('#calendar-grid > div').forEach(d => d.classList.remove('ring-2', 'ring-offset-1',
            'ring-primary'));
            if (el) el.classList.add('ring-2', 'ring-offset-1', 'ring-primary');

            const container = document.getElementById('selected-date-tasks-container');
            const title = document.getElementById('selected-date-title');
            const list = document.getElementById('selected-date-task-list');

            container.classList.remove('hidden');
            const [y, m, d] = dateStr.split('-');
            title.innerText = `${parseInt(m)}月${parseInt(d)}日 任务`;

            list.innerHTML = '';

            if (!appState.tasks[dateStr]) {
                appState.tasks[dateStr] = { tasks: [], note: "" };
                saveData();
            }

            const data = appState.tasks[dateStr];

            if (!data.tasks || data.tasks.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 dark:text-gray-500 text-sm py-4">本日无任务，点击「添加」按钮创建 ✨</div>';
                return;
            }

            data.tasks.forEach((task, idx) => {
                const item = document.createElement('div');
                item.className = "bg-white dark:bg-darkcard p-3 rounded shadow-sm border border-gray-100 dark:border-gray-700 task-item group";

                const header = document.createElement('div');
                header.className = "flex justify-between items-start mb-1";

                const tagSpan = document.createElement('span');
                tagSpan.className = "text-xs font-bold text-primary bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded";
                tagSpan.innerText = task.tag;

                const check = document.createElement('input');
                check.type = "checkbox";
                check.checked = task.done;
                check.className = "w-4 h-4 text-primary rounded cursor-pointer flex-shrink-0";
                check.onchange = (e) => {
                    toggleTask(dateStr, idx, e.target.checked);
                    renderCalendar();
                };

                header.appendChild(tagSpan);
                header.appendChild(check);

                const content = document.createElement('p');
                content.className = "text-sm text-gray-700 dark:text-gray-300 " + (task.done ? "line-through text-gray-400" : "");
                content.innerText = task.content;

                item.appendChild(header);
                item.appendChild(content);

                const actionBar = document.createElement('div');
                actionBar.className = "flex justify-end space-x-3 mt-2 pt-1 border-t border-gray-100 dark:border-gray-700";

                const editBtn = document.createElement('button');
                editBtn.className = "task-action-btn text-gray-400 hover:text-blue-500 text-xs transition";
                editBtn.innerHTML = '<i class="fas fa-edit"></i> 编辑';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    openTaskModal(dateStr, idx);
                };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = "task-action-btn text-gray-400 hover:text-red-500 text-xs transition";
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i> 删除';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (confirm(`确定要删除此任务吗？\n"${task.content.substring(0, 30)}${task.content.length > 30 ? '...' : ''}"`)) {
                        deleteTask(dateStr, idx);
                    }
                };

                actionBar.appendChild(editBtn);
                actionBar.appendChild(deleteBtn);
                item.appendChild(actionBar);

                list.appendChild(item);
            });

            // 绑定日历视图的添加按钮
            const addBtn = container.querySelector('.add-task-btn-calendar');
            if (addBtn) {
                addBtn.onclick = () => openTaskModal(dateStr);
            }
        }

        // --- Rendering: Cockpit ---
        let stageChart = null;

        function renderCockpit() {
            updateCompletedDays();
            const totalDays = 90;
            const completedCount = appState.completedDays.length;
            const percent = Math.round((completedCount / totalDays) * 100);

            document.getElementById('progress-percentage').innerText = `${percent}%`;
            document.getElementById('progress-days-text').innerText = `${completedCount}/${totalDays} 天`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            const chartDom = document.getElementById('echarts-stage');
            if (stageChart) stageChart.dispose();
            stageChart = echarts.init(chartDom, appState.theme === 'dark' ? 'dark' : null);

            const stageData = STAGES.map(s => {
                let count = 0;
                const start = s.name === "基础重塑" ? 1 : (s.name === "强化刷题" ? 33 : 63);
                const end = s.endDay;

                appState.completedDays.forEach(dateStr => {
                    const dayNum = diffDays(START_DATE, dateStr) + 1;
                    if (dayNum >= start && dayNum <= end) count++;
                });

                return { name: s.name, value: count, max: end - start + 1 };
            });

            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    show: false
                },
                yAxis: {
                    type: 'category',
                    data: stageData.map(d => d.name),
                    axisLine: { show: false },
                    axisTick: { show: false }
                },
                series: [{
                    name: '已完成天数',
                    type: 'bar',
                    data: stageData.map(d => ({
                        value: d.value,
                        itemStyle: { borderRadius: [0, 10, 10, 0], color: '#3b82f6' }
                    })),
                    label: {
                        show: true,
                        position: 'right',
                        formatter: (p) => `${p.value} / ${stageData[p.dataIndex].max}`
                    },
                    barWidth: '50%'
                }]
            };
            stageChart.setOption(option);

            const badgeGrid = document.getElementById('badge-grid');
            badgeGrid.innerHTML = '';
            BADGES.forEach(badge => {
                const isUnlocked = completedCount >= badge.condition;
                const div = document.createElement('div');
                div.className = "flex flex-col items-center justify-center p-2 rounded-lg " + (isUnlocked ?
                    "bg-yellow-50 dark:bg-yellow-900/20" : "bg-gray-100 dark:bg-gray-800 opacity-50 grayscale");
                div.innerHTML = `
                        <i class="fas ${badge.icon} text-2xl mb-1 ${badge.color}"></i>
                        <span class="text-[10px] text-center leading-tight">${badge.name}</span>
                        <span class="text-[9px] text-gray-400 mt-1">${badge.condition}天</span>
                    `;
                badgeGrid.appendChild(div);
            });
        }

        // --- Task CRUD Operations ---

        function toggleTask(dateStr, index, isChecked) {
            if (appState.tasks[dateStr] && appState.tasks[dateStr].tasks[index]) {
                appState.tasks[dateStr].tasks[index].done = isChecked;
                saveData();
                const currentView = document.querySelector('.view-section:not(.hidden)');
                if (currentView) {
                    if (currentView.id === 'view-today') {
                        renderToday();
                    } else if (currentView.id === 'view-calendar') {
                        renderCalendar();
                    } else if (currentView.id === 'view-cockpit') {
                        renderCockpit();
                    }
                }
                updateCompletedDays();
                if (document.getElementById('view-cockpit').classList.contains('hidden') === false) {
                    renderCockpit();
                }
            }
        }

        function updateCompletedDays() {
            const completed = [];
            for (const date in appState.tasks) {
                const tasks = appState.tasks[date].tasks;
                if (tasks && tasks.length > 0 && tasks.every(t => t.done)) {
                    completed.push(date);
                }
            }
            appState.completedDays = completed;
            saveData();
        }

        function openTaskModal(dateStr, index) {
            const modal = document.getElementById('task-modal');
            const title = document.getElementById('task-modal-title');
            const dateInput = document.getElementById('task-modal-date');
            const indexInput = document.getElementById('task-modal-index');
            const tagInput = document.getElementById('task-modal-tag');
            const contentInput = document.getElementById('task-modal-content');
            const goalInput = document.getElementById('task-modal-goal');

            dateInput.value = dateStr;

            if (index !== undefined && index >= 0) {
                const taskData = appState.tasks[dateStr]?.tasks[index];
                if (!taskData) {
                    showToast('任务不存在', 'error');
                    return;
                }
                title.innerText = '编辑任务';
                indexInput.value = index;
                tagInput.value = taskData.tag || '';
                contentInput.value = taskData.content || '';
                goalInput.value = taskData.goal || '';
            } else {
                title.innerText = '添加任务';
                indexInput.value = '-1';
                tagInput.value = '';
                contentInput.value = '';
                goalInput.value = '';
            }

            modal.classList.remove('hidden');
            setTimeout(() => contentInput.focus(), 100);
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function saveTaskFromModal() {
            const dateStr = document.getElementById('task-modal-date').value;
            const index = parseInt(document.getElementById('task-modal-index').value);
            const tag = document.getElementById('task-modal-tag').value.trim();
            const content = document.getElementById('task-modal-content').value.trim();
            const goal = document.getElementById('task-modal-goal').value.trim();

            if (!tag) {
                showToast('请输入标签', 'error');
                return;
            }
            if (!content) {
                showToast('请输入任务内容', 'error');
                return;
            }

            if (!appState.tasks[dateStr]) {
                appState.tasks[dateStr] = { tasks: [], note: "" };
            }

            const taskObj = { tag, content, goal, done: false };

            if (index >= 0 && index < appState.tasks[dateStr].tasks.length) {
                const existing = appState.tasks[dateStr].tasks[index];
                taskObj.done = existing.done || false;
                appState.tasks[dateStr].tasks[index] = taskObj;
                showToast('任务已更新', 'success');
            } else {
                appState.tasks[dateStr].tasks.push(taskObj);
                showToast('任务已添加', 'success');
            }

            saveData();
            closeTaskModal();

            const currentView = document.querySelector('.view-section:not(.hidden)');
            if (currentView) {
                if (currentView.id === 'view-today') {
                    renderToday();
                } else if (currentView.id === 'view-calendar') {
                    renderCalendar();
                } else if (currentView.id === 'view-cockpit') {
                    renderCockpit();
                }
            }
            updateCompletedDays();
        }

        function deleteTask(dateStr, index) {
            if (!appState.tasks[dateStr] || !appState.tasks[dateStr].tasks[index]) {
                showToast('任务不存在', 'error');
                return;
            }
            appState.tasks[dateStr].tasks.splice(index, 1);
            if (!appState.tasks[dateStr].tasks) {
                appState.tasks[dateStr].tasks = [];
            }
            saveData();
            updateCompletedDays();

            const currentView = document.querySelector('.view-section:not(.hidden)');
            if (currentView) {
                if (currentView.id === 'view-today') {
                    renderToday();
                } else if (currentView.id === 'view-calendar') {
                    renderCalendar();
                } else if (currentView.id === 'view-cockpit') {
                    renderCockpit();
                }
            }
            showToast('任务已删除', 'info');
        }

        // --- Template Modal ---
        function openTemplateModal(dateStr) {
            const modal = document.getElementById('template-modal');
            const list = document.getElementById('template-list');
            list.innerHTML = '';

            TEMPLATES.forEach((template, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 border-b border-gray-100 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition";
                item.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-primary bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded">${template.tag}</span>
                            <p class="text-sm text-gray-700 dark:text-gray-300 mt-1">${template.content}</p>
                            ${template.goal ? `<p class="text-xs text-blue-500 dark:text-blue-400">目标：${template.goal}</p>` : ''}
                        </div>
                        <i class="fas fa-plus-circle text-primary text-lg"></i>
                    `;
                item.onclick = () => {
                    // 将模板添加到指定日期
                    if (!appState.tasks[dateStr]) {
                        appState.tasks[dateStr] = { tasks: [], note: "" };
                    }
                    appState.tasks[dateStr].tasks.push({
                        tag: template.tag,
                        content: template.content,
                        goal: template.goal || '',
                        done: false
                    });
                    saveData();
                    closeTemplateModal();
                    const currentView = document.querySelector('.view-section:not(.hidden)');
                    if (currentView) {
                        if (currentView.id === 'view-today') {
                            renderToday();
                        } else if (currentView.id === 'view-calendar') {
                            renderCalendar();
                        }
                    }
                    showToast('模板已添加', 'success');
                };
                list.appendChild(item);
            });

            modal.classList.remove('hidden');
        }

        function closeTemplateModal() {
            document.getElementById('template-modal').classList.add('hidden');
        }

        // --- Export Today Plan ---
        function exportTodayPlan() {
            const todayStr = getDateString(new Date());
            const dayData = appState.tasks[todayStr];
            if (!dayData || !dayData.tasks || dayData.tasks.length === 0) {
                showToast('今日暂无任务可导出', 'error');
                return;
            }

            const groups = {};
            dayData.tasks.forEach(task => {
                if (!groups[task.tag]) groups[task.tag] = [];
                groups[task.tag].push(task);
            });

            let lines = [];
            let counter = 1;
            // 自定义标签顺序
            const tagOrder = ['行测-资料分析', '申论', '常识时政', '申论规范词积累', '复盘', '行测-言语理解', '行测-判断推理', '行测-数量关系', '其他'];
            const sortedTags = Object.keys(groups).sort((a, b) => {
                const idxA = tagOrder.indexOf(a) === -1 ? 999 : tagOrder.indexOf(a);
                const idxB = tagOrder.indexOf(b) === -1 ? 999 : tagOrder.indexOf(b);
                return idxA - idxB;
            });

            for (const tag of sortedTags) {
                const tasks = groups[tag];
                tasks.forEach(task => {
                    let taskText = `${counter}、${tag}：${task.content}`;
                    if (task.goal) taskText += `（目标：${task.goal}）`;
                    lines.push(taskText);
                    counter++;
                });
            }

            if (dayData.note) {
                lines.push(`\n备注：${dayData.note}`);
            }

            const content = lines.join('\n');
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `今日计划_${todayStr}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('今日计划导出成功', 'success');
        }

        // --- Data Management ---
        function exportData() {
            const dataStr = JSON.stringify(appState, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gongkao_backup_${getDateString(new Date())}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据导出成功', 'success');
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.tasks && data.completedDays !== undefined) {
                        appState = data;
                        saveData();
                        applyTheme();
                        renderCountdowns();
                        renderToday();
                        renderCalendar();
                        renderCockpit();
                        showToast('数据导入成功', 'success');
                    } else {
                        throw new Error("格式不正确");
                    }
                } catch (err) {
                    showToast('导入失败：文件格式错误', 'error');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function resetData() {
            if (confirm("确定要重置所有进度吗？此操作不可恢复。")) {
                localStorage.removeItem('gongkao_app_v1');
                location.reload();
            }
        }

        // --- Init ---
        window.addEventListener('DOMContentLoaded', initApp);

        window.addEventListener('resize', () => {
            if (stageChart) stageChart.resize();
        });
    </script>
</body>
</html>
