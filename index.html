            // ---------- 周报 ----------
            function generateWeeklyReport() {
                const today = getDateString(new Date());
                let totalTasks = 0,
                    doneTasks = 0,
                    totalCorrect = 0,
                    totalWrong = 0;
                let lastWeekDone = 0,
                    lastWeekTotal = 0;
                for (const date in state.tasks) {
                    const diff = diffDays(date, today);
                    if (diff >= 0 && diff <= 6) {
                        const day = state.tasks[date];
                        if (day.tasks) {
                            day.tasks.forEach(t => {
                                totalTasks++;
                                if (t.done) doneTasks++;
                                totalCorrect += t.correct || 0;
                                totalWrong += t.wrong || 0;
                            });
                        }
                    }
                    if (diff >= 7 && diff <= 13) {
                        const day = state.tasks[date];
                        if (day.tasks) {
                            day.tasks.forEach(t => {
                                lastWeekTotal++;
                                if (t.done) lastWeekDone++;
                            });
                        }
                    }
                }
                const rate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;
                const correctRate = (totalCorrect + totalWrong) > 0 ? Math.round((totalCorrect / (totalCorrect + totalWrong)) *
                    100) : 0;
                const lastRate = lastWeekTotal > 0 ? Math.round((lastWeekDone / lastWeekTotal) * 100) : 0;
                let tip = '';
                if (rate >= 80) tip = '🎉 本周表现优秀，继续保持！';
                else if (rate >= 50) tip = '💪 进度过半，加油冲刺！';
                else tip = '📚 本周需要加把劲了！';
                if (lastRate > 0 && rate > lastRate) tip += ` 较上周提升 ${rate - lastRate}%`;
                else if (lastRate > 0 && rate < lastRate) tip += ` 较上周下降 ${lastRate - rate}%`;
                return { tasks: totalTasks, rate, correctRate, tip };
            }

            // ---------- 各科进度 ----------
            function calculateSubjectProgress() {
                const targets = {
                    '行测-资料分析': 60,
                    '申论': 20,
                    '常识时政': 15,
                    '复盘': 10,
                    '行测-言语理解': 30,
                    '行测-判断推理': 25,
                    '行测-数量关系': 20
                };
                const done = {};
                for (const date in state.tasks) {
                    if (state.tasks[date].tasks) {
                        state.tasks[date].tasks.forEach(t => {
                            if (t.done) {
                                done[t.tag] = (done[t.tag] || 0) + 1;
                            }
                        });
                    }
                }
                const result = [];
                for (const tag in targets) {
                    const count = done[tag] || 0;
                    const target = targets[tag];
                    result.push({ tag, count, target, pct: Math.min(Math.round((count / target) * 100), 100) });
                }
                return result.sort((a, b) => b.pct - a.pct);
            }

                let html = '';
                data.forEach(item => {
                    const color = item.pct >= 80 ? 'bg-green-500' : item.pct >= 50 ? 'bg-blue-500' : 'bg-yellow-500';
                    html += `
                        <div>
                            <div class="flex justify-between text-xs">
                                <span class="text-gray-700 dark:text-gray-300 truncate max-w-[80px]">${item.tag}</span>

                    let count = 0;
                    state.completedDays.forEach(d => {
                        const day = diffDays(state.startDate, d) + 1;
                        if (day >= start && day <= end) count++;

                    const totalInStage = end - start + 1;
                    const pct = Math.round((count / totalInStage) * 100);
                    const color = i === 0 ? 'bg-green-500' : i === 1 ? 'bg-blue-500' : i === 2 ? 'bg-yellow-500' :
                        'bg-purple-500';
                    html += `

            function renderHeatmapChart() {
                const dom = document.getElementById('chart-heatmap');
                if (!dom) return;
                if (chartHeatmap) chartHeatmap.dispose();
                chartHeatmap = echarts.init(dom, state.theme === 'dark' ? 'dark' : null);
                const now = new Date();
                const year = now.getFullYear();
                const month = now.getMonth();
                const startDate = new Date(year, month, 1);
                startDate.setMonth(startDate.getMonth() - 2);
                const endDate = new Date(year, month + 1, 0);

                const data = [];
                const temp = {};
                for (const date in state.tasks) {
                    const d = new Date(date);
                    if (d >= startDate && d <= endDate) {
                        const tasks = state.tasks[date].tasks || [];
                        const done = tasks.filter(t => t.done).length;
                        temp[date] = done;
                    }
                }
                for (const date in temp) {
                    const d = new Date(date);
                    data.push({ value: [d.getFullYear(), d.getMonth(), d.getDate()], count: temp[date] || 0 });
                }

                if (data.length === 0) {
                    chartHeatmap.setOption({ title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { fontSize: 12,
                                color: '#9ca3af' } } });
                    return;
                }

                const maxCount = Math.max(...data.map(d => d.count), 1);
                chartHeatmap.setOption({
                    tooltip: { formatter: function(params) {
                            const d = new Date(params.value[0], params.value[1], params.value[2]);
                            return `${d.toLocaleDateString()}<br/>完成 ${params.data.count} 个任务`;
                        } },
                    visualMap: { min: 0, max: maxCount, calculable: true, inRange: { color: ['#ebedf0', '#9be9a8',

                            rangeList.appendChild(rangeItem);
                        });
                    }
                    div.appendChild(rangeList);

                    const detailContainer = document.createElement('div');
                    detailContainer.className = 'mt-2 space-y-1 hidden';
                    detailContainer.dataset.notebookId = nb.id;
                    div.appendChild(detailContainer);

                    container.appendChild(div);
                });
                renderReviewReminder();
            }

            function toggleRangeErrors(nb, rangeName, item) {
                const container = item.parentElement.parentElement.querySelector('.space-y-1:last-child');
                if (!container) return;
                if (container.classList.contains('hidden')) {
                    container.classList.remove('hidden');
                    const errors = nb.errors ? nb.errors.filter(e => e.rangeName === rangeName) : [];
                    container.innerHTML = '';
                    if (errors.length === 0) {
                        container.innerHTML = '<div class="text-xs text-gray-400 dark:text-gray-500 pl-4">暂无错题</div>';
                    } else {
                        errors.slice().reverse().forEach(e => {
                            const div = document.createElement('div');
                            div.className = 'error-item text-xs text-gray-700 dark:text-gray-300 pl-2';
                            const reasons = e.reasons ? e.reasons.join(',') : '';
                            const dateStr = e.date || '未知';
                            div.innerHTML =
                                `<span class="font-medium">${e.page}</span> 错因: ${reasons} ${e.note ? '· '+e.note : ''} <span class="text-gray-400">${dateStr}</span>
                                <button class="text-red-400 hover:text-red-600 ml-2" onclick="window.deleteError('${nb.id}','${e.id}')"><i class="fas fa-times"></i></button>`;
                            container.appendChild(div);
                        });
                    }
                } else {
                    container.classList.add('hidden');
                }
            }

            window.deleteError = function(notebookId, errorId) {
                if (!confirm('删除此错题记录？')) return;
                const nb = state.notebooks.find(n => n.id === notebookId);
                if (!nb) return;
                nb.errors = nb.errors.filter(e => e.id !== errorId);
                saveState();
                renderNotebookList();
                renderNotebookStats();
                showToast('错题已删除', 'info');
            };

            function deleteNotebook(notebookId) {
                state.notebooks = state.notebooks.filter(n => n.id !== notebookId);
                for (const date in state.tasks) {
                    if (state.tasks[date].tasks) {
                        state.tasks[date].tasks.forEach(t => {
                            if (t.notebookId === notebookId) t.notebookId = null;
                        });
                    }
                }
                saveState();
                renderNotebookList();
                renderNotebookStats();
                showToast('题本已删除', 'info');
            }

            function renderReviewReminder() {
                const container = document.getElementById('review-reminder');
                const list = document.getElementById('review-list');
                if (!container || !list) return;
                const today = new Date();
                let dueErrors = [];
                state.notebooks.forEach(nb => {
                    if (nb.errors) {
                        nb.errors.forEach(e => {
                            if (!e.date) return;
                            const daysDiff = diffDays(e.date, getDateString(today));
                            const intervals = [1, 2, 4, 7, 15];
                            if (intervals.some(d => daysDiff === d)) {
                                dueErrors.push({ ...e, notebookName: nb.name });
                            }
                        });
                    }
                });
                if (dueErrors.length === 0) {
                    container.classList.add('hidden');
                    return;
                }
                container.classList.remove('hidden');
                list.innerHTML = '';
                dueErrors.slice(0, 10).forEach(e => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center text-xs';
                    div.innerHTML =
                        `<span>${e.notebookName} · ${e.page} (${e.reasons.join(',')})</span><span class="review-due">待复习</span>`;
                    list.appendChild(div);
                });
                if (dueErrors.length > 10) {
                    const more = document.createElement('div');
                    more.className = 'text-xs text-gray-400';
                    more.textContent = `还有 ${dueErrors.length-10} 条待复习`;
                    list.appendChild(more);
                }
            }

            function renderNotebookStats() {
                const container = document.getElementById('notebook-stats-table');
                const chartDom = document.getElementById('notebook-stats-chart');
                if (!container || !chartDom) return;
                const stats = {};
                state.notebooks.forEach(nb => {
                    stats[nb.id] = { name: nb.name, total: 0, reasons: { K: 0, J: 0, S: 0 } };
                    if (nb.errors) {
                        nb.errors.forEach(e => {
                            stats[nb.id].total += 1;
                            if (e.reasons) {
                                e.reasons.forEach(r => {
                                    if (stats[nb.id].reasons[r] !== undefined) stats[nb.id].reasons[r] += 1;
                                });
                            }
                        });
                    }
                });

                container.innerHTML = '';
                const ids = Object.keys(stats);
                if (ids.length === 0) {
                    container.innerHTML =
                        '<div class="text-center text-gray-400 dark:text-gray-500 text-sm py-4">暂无错题数据</div>';
                    if (chartNotebook) chartNotebook.dispose();
                    chartNotebook = echarts.init(chartDom, state.theme === 'dark' ? 'dark' : null);
                    chartNotebook.setOption({ title: { text: '暂无错题', left: 'center', top: 'center' } });
                    return;
                }
                ids.forEach(id => {
                    const s = stats[id];
                    const div = document.createElement('div');
                    div.className = 'bg-gray-50 dark:bg-gray-800/50 rounded-lg p-3 stat-card';
                    const r = s.reasons;
                    div.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-gray-800 dark:text-gray-200">${s.name}</span>
                            <span class="text-sm text-gray-500 dark:text-gray-400">错题 ${s.total}</span>
                        </div>
                        <div class="flex gap-3 mt-1 text-xs">
                            <span>K: ${r.K}</span><span>J: ${r.J}</span><span>S: ${r.S}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });

                if (chartNotebook) chartNotebook.dispose();
                chartNotebook = echarts.init(chartDom, state.theme === 'dark' ? 'dark' : null);
                const xData = ids.map(id => stats[id].name);
                const kData = ids.map(id => stats[id].reasons.K);
                const jData = ids.map(id => stats[id].reasons.J);
                const sData = ids.map(id => stats[id].reasons.S);
                chartNotebook.setOption({
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['K', 'J', 'S'], bottom: 0 },
                    grid: { left: '3%', right: '4%', bottom: '20%', containLabel: true },
                    xAxis: { type: 'category', data: xData, axisLabel: { fontSize: 10 } },
                    yAxis: { type: 'value' },
                    series: [
                        { name: 'K', type: 'bar', data: kData, stack: 'total', color: '#3b82f6' },
                        { name: 'J', type: 'bar', data: jData, stack: 'total', color: '#f59e0b' },
                        { name: 'S', type: 'bar', data: sData, stack: 'total', color: '#ef4444' }
                    ]
                });
                chartNotebook.resize();
            }

            function openTaskModal(dateStr, index) {
                const modal = document.getElementById('task-modal');
                document.getElementById('task-modal-date').value = dateStr;
                document.getElementById('task-modal-index').value = index !== undefined ? index : -1;
                const select = document.getElementById('task-modal-notebook');
                select.innerHTML = '<option value="">无</option>';
                state.notebooks.forEach(nb => {
                    const opt = document.createElement('option');
                    opt.value = nb.id;
                    opt.textContent = nb.name;
                    select.appendChild(opt);
                });
                updateRangeSelect();
                renderRecentNotebooks();

                document.querySelectorAll('.tag-quick-btn').forEach(btn => {
                    btn.onclick = function() {
                        document.getElementById('task-modal-tag').value = this.dataset.tag;
                    };
                });

                if (index !== undefined && index >= 0) {
                    const task = state.tasks[dateStr]?.tasks[index];
                    if (!task) { showToast('任务不存在', 'error'); return; }
                    document.getElementById('task-modal-title').textContent = '编辑任务';
                    document.getElementById('task-modal-tag').value = task.tag || '';
                    document.getElementById('task-modal-content').value = task.content || '';
                    document.getElementById('task-modal-goal').value = task.goal || '';
                    document.getElementById('task-modal-priority').value = task.priority || 'medium';
                    if (task.notebookId) {
                        select.value = task.notebookId;
                        updateRangeSelect();
                        const rangeSelect = document.getElementById('task-modal-range-select');
                        const rangeCustom = document.getElementById('task-modal-range-custom');
                        if (task.range) {
                            let matched = false;
                            for (let i = 0; i < rangeSelect.options.length; i++) {
                                if (rangeSelect.options[i].value === task.range) {
                                    rangeSelect.value = task.range;
                                    matched = true;
                                    break;
                                }
                            }
                            if (!matched) { rangeSelect.value = '';
                                rangeCustom.value = task.range; }
                        } else { rangeSelect.value = '';
                            rangeCustom.value = ''; }
                    } else {
                        select.value = '';
                        updateRangeSelect();
                        document.getElementById('task-modal-range-select').value = '';
                        document.getElementById('task-modal-range-custom').value = task.range || '';
                    }
                } else {
                    document.getElementById('task-modal-title').textContent = '添加任务';

                    document.getElementById('task-modal-content').value = '';
                    document.getElementById('task-modal-goal').value = '';

                const contentArea = document.getElementById('task-modal-content');
                const handler = function(e) {
                    if (e.ctrlKey && e.key === 'Enter') {
                        saveBtn.click();
                    }

                modal._keyHandler = handler;

            function saveTaskFromModal() {

                const index = parseInt(document.getElementById('task-modal-index').value);
                const tag = document.getElementById('task-modal-tag').value.trim();
                const content = document.getElementById('task-modal-content').value.trim();
                const goal = document.getElementById('task-modal-goal').value.trim();
                const priority = document.getElementById('task-modal-priority').value;
                const notebookId = document.getElementById('task-modal-notebook').value || null;
                let range = document.getElementById('task-modal-range-select').value;
                if (range === '') range = document.getElementById('task-modal-range-custom').value.trim();
                if (!tag || !content) { showToast('请填写标签和内容', 'error'); return; }
                if (!state.tasks[dateStr]) state.tasks[dateStr] = { tip: '', tasks: [], note: '' };
                const taskObj = { tag, content, goal, done: false, notebookId, range, correct: 0, wrong: 0,
                    wrongReasonsCount: { K: 0, J: 0, S: 0 }, priority };
                if (index >= 0 && index < state.tasks[dateStr].tasks.length) {
                    const old = state.tasks[dateStr].tasks[index];
                    taskObj.done = old.done;
                    taskObj.correct = old.correct || 0;
                    taskObj.wrong = old.wrong || 0;
                    taskObj.wrongReasonsCount = old.wrongReasonsCount || { K: 0, J: 0, S: 0 };
                    state.tasks[dateStr].tasks[index] = taskObj;
                    showToast('任务已更新', 'success');
                } else {
                    state.tasks[dateStr].tasks.push(taskObj);
                    showToast('任务已添加', 'success');
                }
                if (notebookId) updateRecentNotebooks(notebookId);
                saveState();
                closeTaskModal();
                renderToday();
                if (currentView === 'view-calendar') renderCalendar();
            }

            // ---------- 导出 ----------
            function exportErrors() {
                let lines = [];
                state.notebooks.forEach(nb => {
                    if (nb.errors && nb.errors.length) {
                        lines.push(`【${nb.name}】`);
                        nb.errors.forEach(e => {
                            const range = e.rangeName || '未分类';
                            const reasons = e.reasons ? e.reasons.join(',') : '';
                            const note = e.note ? ` (${e.note})` : '';
                            lines.push(`  ${range} | ${e.page} | 错因: ${reasons}${note} | ${e.date || ''}`);
                        });
                    }
                });
                if (lines.length === 0) {
                    showToast('暂无错题可导出', 'error');
                    return;
                }
                const content = lines.join('\n');
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `错题本_${getDateString(new Date())}.txt`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('错题已导出', 'success');
            }

            function exportTodayPlan() {
                const todayStr = getDateString(new Date());
                const dayData = state.tasks[todayStr];
                if (!dayData?.tasks?.length) { showToast('今日暂无任务', 'error'); return; }
                const groups = {};
                dayData.tasks.forEach(t => {
                    if (!groups[t.tag]) groups[t.tag] = [];
                    groups[t.tag].push(t);
                });
                let lines = [],
                    cnt = 1;
                const order = ['行测-资料分析', '申论', '常识时政', '申论规范词积累', '复盘', '行测-言语理解', '行测-判断推理',
                    '行测-数量关系', '其他'
                ];
                const sorted = Object.keys(groups).sort((a, b) => (order.indexOf(a) === -1 ? 999 : order.indexOf(a)) - (order
                    .indexOf(b) === -1 ? 999 : order.indexOf(b)));
                for (const tag of sorted) {
                    groups[tag].forEach(t => {
                        let text = `${cnt}、${tag}：${t.content}`;
                        if (t.goal) text += `（目标：${t.goal}）`;
                        lines.push(text);
                        cnt++;
                    });
                }
                if (dayData.note) lines.push(`\n备注：${dayData.note}`);
                const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `今日计划_${todayStr}.txt`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('导出成功', 'success');
            }

            function exportExcel() {
                let rows = [
                    ['日期', '标签', '内容', '目标', '完成', '优先级', '正确', '错误', '题本', '范围']
                ];
                for (const date in state.tasks) {
                    const day = state.tasks[date];
                    if (day.tasks) {
                        day.tasks.forEach(t => {
                            rows.push([
                                date, t.tag || '', t.content || '', t.goal || '',
                                t.done ? '是' : '否', t.priority || 'medium',
                                t.correct || 0, t.wrong || 0,
                                t.notebookId ? (state.notebooks.find(n => n.id === t.notebookId)?.name || '') :
                                '',
                                t.range || ''
                            ]);
                        });
                    }
                }
                rows.push([]);
                rows.push(['错题导出']);
                rows.push(['题本', '范围', '页码', '错因', '备注', '日期']);
                state.notebooks.forEach(nb => {
                    if (nb.errors) {
                        nb.errors.forEach(e => {
                            rows.push([nb.name, e.rangeName || '未分类', e.page || '', (e.reasons || [])
                                .join(','), e.note || '', e.date || ''
                            ]);
                        });
                    }
                });
                let csv = rows.map(row => row.join(',')).join('\n');
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `考公数据_${getDateString(new Date())}.csv`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('Excel数据已导出', 'success');
            }

            function exportData() {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `gongkao_backup_${getDateString(new Date())}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('数据导出成功', 'success');
            }

            function importData(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.tasks || typeof data.tasks !== 'object') {
                            throw new Error('缺少 tasks 字段');
                        }
                        for (const date in data.tasks) {
                            if (data.tasks[date].tasks) {
                                data.tasks[date].tasks = data.tasks[date].tasks.map(t => normalizeTask(t));
                            }
                            if (!data.tasks[date].tip) data.tasks[date].tip = '';
                            if (!data.tasks[date].note) data.tasks[date].note = '';
                        }
                        if (data.notebooks) {
                            data.notebooks = data.notebooks.map(nb => normalizeNotebook(nb));
                        } else {
                            data.notebooks = [];
                        }
                        if (!data.startDate) data.startDate = getDateString(new Date());
                        if (!data.endDate) data.endDate = '2026-12-07';
                        if (!data.exams || !data.exams.length) data.exams = [{ name: '江苏省公务员考试',
                            date: '2026-12-07' }];
                        if (!data.completedDays) data.completedDays = [];
                        if (!data.dailyCompletion) data.dailyCompletion = {};
                        if (!data.errorHistory) data.errorHistory = {};
                        if (!data.theme) data.theme = 'light';
                        if (!data.lastVisitDate) data.lastVisitDate = getDateString(new Date());
                        if (!data.achievements) data.achievements = {};

                        state = deepMerge(state, data);
                        for (const date in state.tasks) {
                            if (state.tasks[date].tasks) {
                                state.tasks[date].tasks = state.tasks[date].tasks.map(t => normalizeTask(t));
                            }
                        }
                        state.notebooks = state.notebooks.map(nb => normalizeNotebook(nb));

                        saveState();
                        applyTheme();
                        accumulateAllPastTasks();
                        renderCountdowns();
                        renderToday();
                        renderCalendar();
                        renderCockpit();
                        renderNotebookList();
                        renderNotebookStats();
                        showToast('✅ 数据导入并累积完成！', 'success');
                    } catch (err) {
                        console.error(err);
                        showToast('❌ 导入失败：' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            function resetData() {
                if (confirm('确定重置所有数据？此操作不可恢复！')) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                }
            }

            // ---------- 日期、考试、倒计时 ----------
            function saveDates() {
                const start = document.getElementById('settings-start-date').value;
                const end = document.getElementById('settings-end-date').value;
                if (!start || !end) { showToast('请选择完整日期', 'error'); return; }
                if (diffDays(start, end) < 0) { showToast('结束日期必须晚于开始日期', 'error'); return; }
                state.startDate = start;
                state.endDate = end;
                saveState();
                accumulateAllPastTasks();
                renderCountdowns();
                renderToday();
                renderCalendar();
                renderCockpit();
                showToast('日期已更新，任务已累积', 'success');
            }

            // ---------- 倒计时渲染 + 刷新 ----------
            function renderCountdowns() {
                const container = document.getElementById('countdown-container');
                const preview = document.getElementById('countdown-preview');
                if (!container || !preview) return;
                container.innerHTML = '';
                const today = new Date();
                if (!state.exams || !state.exams.length) {
                    preview.textContent = '未设置考试';
                    const div = document.createElement('div');
                    div.className = 'text-xs text-gray-400 dark:text-gray-500';
                    div.textContent = '请在设置中添加考试';
                    container.appendChild(div);
                    return;
                }
                const first = state.exams[0];
                const diff = Math.ceil((new Date(first.date) - today) / (1000 * 3600 * 24));
                preview.textContent = `${first.name} 还有 ${diff} 天`;

                state.exams.forEach(exam => {
                    const examDate = new Date(exam.date);
                    const diff2 = Math.ceil((examDate - today) / (1000 * 3600 * 24));
                    const div = document.createElement('div');
                    div.className =
                        'flex items-center gap-1.5 bg-blue-50 dark:bg-blue-900/30 rounded-full px-3 py-1 text-xs text-gray-700 dark:text-gray-300';
                    div.innerHTML =
                        `<span class="font-medium">${exam.name}</span><span class="text-primary font-bold">${diff2}</span><span class="text-gray-400">天</span>`;
                    container.appendChild(div);
                });
            }

            function setupCountdownToggle() {
                const toggle = document.getElementById('countdown-toggle');
                const body = document.getElementById('countdown-body');
                if (!toggle || !body) return;
                toggle.addEventListener('click', function() {
                    this.classList.toggle('open');
                    body.classList.toggle('open');
                    // 每次展开时刷新倒计时内容
                    if (body.classList.contains('open')) {
                        renderCountdowns();
                    }
                });
                // 默认展开
                toggle.classList.add('open');
                body.classList.add('open');
                // 初始渲染
                renderCountdowns();
            }

            function updateSettingsUI() {
                document.getElementById('settings-start-date').value = state.startDate;
                document.getElementById('settings-end-date').value = state.endDate;
                renderExamList();
            }

            function renderExamList() {
                const container = document.getElementById('exam-list-container');
                container.innerHTML = '';
                state.exams.forEach((exam, index) => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-2 text-sm';
                    div.innerHTML =
                        `<span class="flex-1 truncate">${exam.name}</span><span class="text-gray-500 text-xs">${exam.date}</span><button class="text-red-400 hover:text-red-600 delete-exam" data-index="${index}"><i class="fas fa-times"></i></button>`;
                    container.appendChild(div);
                });
                container.querySelectorAll('.delete-exam').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        state.exams.splice(idx, 1);
                        saveState();
                        renderExamList();
                        renderCountdowns();
                    });
                });
            }

            function addExam() {
                const name = document.getElementById('new-exam-name').value.trim();
                const date = document.getElementById('new-exam-date').value;
                if (!name || !date) { showToast('请填写考试名称和日期', 'error'); return; }
                state.exams.push({ name, date });
                saveState();
                renderExamList();
                renderCountdowns();
                document.getElementById('new-exam-name').value = '';
                document.getElementById('new-exam-date').value = '';
                showToast('考试已添加', 'success');
            }

            // ---------- 主题 ----------
            function applyTheme() {
                if (state.theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }

            function toggleTheme() {
                state.theme = state.theme === 'light' ? 'dark' : 'light';
                applyTheme();
                saveState();
                if (currentView === 'view-cockpit') renderCockpit();
            }

            // ---------- 自动备份 ----------
            function setupAutoBackup() {
                const last = localStorage.getItem(AUTO_BACKUP_KEY);
                const now = Date.now();
                const week = 7 * 24 * 60 * 60 * 1000;
                if (!last || now - parseInt(last) > week) {
                    const dataStr = JSON.stringify(state, null, 2);
                    const blob = new Blob([dataStr], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `gongkao_auto_backup_${getDateString(new Date())}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    localStorage.setItem(AUTO_BACKUP_KEY, String(now));
                    showToast('自动备份完成', 'success');
                }
            }

            // ---------- 初始化 ----------
            function init() {
                loadState();
                applyTheme();
                checkRollover();
                setupAutoBackup();
                setupCountdownToggle(); // 会调用 renderCountdowns 并绑定展开刷新

                switchView('view-today');

                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => switchView(btn.dataset.target));
                });
                document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
                document.getElementById('settings-btn').addEventListener('click', () => {
                    document.getElementById('settings-modal').classList.remove('hidden');
                    updateSettingsUI();
                });
                document.getElementById('close-settings').addEventListener('click', () => {
                    document.getElementById('settings-modal').classList.add('hidden');
                });
                document.getElementById('save-dates-btn').addEventListener('click', saveDates);
                document.getElementById('add-exam-btn').addEventListener('click', addExam);
                document.getElementById('export-btn').addEventListener('click', exportData);
                document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file')
                    .click());
                document.getElementById('import-file').addEventListener('change', importData);
                document.getElementById('reset-btn').addEventListener('click', resetData);
                document.getElementById('export-excel-btn').addEventListener('click', exportExcel);

                document.getElementById('close-task-modal').addEventListener('click', closeTaskModal);
                document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
                document.getElementById('task-modal-save').addEventListener('click', saveTaskFromModal);
                document.getElementById('task-modal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeTaskModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') closeTaskModal();
                });

                document.getElementById('close-template-modal').addEventListener('click', closeTemplateModal);
                document.getElementById('template-modal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeTemplateModal();
                });

                document.getElementById('close-score-modal').addEventListener('click', closeScoreModal);
                document.getElementById('score-modal-cancel').addEventListener('click', closeScoreModal);
                document.getElementById('score-modal-save').addEventListener('click', saveScore);
                document.getElementById('score-modal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeScoreModal();
                });

                document.getElementById('close-error-modal').addEventListener('click', closeErrorModal);
                document.getElementById('error-modal-cancel').addEventListener('click', closeErrorModal);
                document.getElementById('error-modal-save').addEventListener('click', saveError);
                document.getElementById('error-modal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeErrorModal();
                });

                document.getElementById('close-notebook-modal').addEventListener('click', closeNotebookModal);
                document.getElementById('notebook-modal-cancel').addEventListener('click', closeNotebookModal);
                document.getElementById('notebook-modal-save').addEventListener('click', saveNotebook);
                document.getElementById('notebook-modal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeNotebookModal();
                });
                document.getElementById('add-range-btn').addEventListener('click', () => addRangeInput('', 0));
                document.getElementById('task-modal-notebook').addEventListener('change', updateRangeSelect);

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        const modals = document.querySelectorAll('.modal-overlay:not(.hidden)');
                        modals.forEach(m => {
                            const closeBtn = m.querySelector('[id$="-modal"] .fa-times')?.closest('button');
                            if (closeBtn) closeBtn.click();
                        });
                    }
                });

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        [chartStage, chartDaily, chartError, chartNotebook, chartSubject, chartReason,
                            chartReasonPie, chartHeatmap
                        ].forEach(c => {
                            if (c && c.resize) c.resize();
                        });
                    }, 300);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
