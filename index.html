<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>90天公考执行计划</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#f4f6fc; --card:#ffffff; --primary:#3468dc; --primary-light:#eef2ff;
  --text:#1e293b; --muted:#94a3b8; --border:#e2e8f0; --success:#16a34a;
  --warn:#f59e0b; --danger:#ef4444;
}
body{font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px;min-height:100vh;}
.header{background:linear-gradient(135deg,#3468dc,#1d4ed8);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.header h1{font-size:20px;font-weight:700;letter-spacing:.5px;}
.header .sub{font-size:13px;opacity:.85;margin-top:2px;}
.container{padding:16px 16px 96px;max-width:800px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.day-header{margin-bottom:16px;}
.day-header .day-num{font-size:28px;font-weight:800;color:var(--primary);}
.day-header .date-info{font-size:14px;color:var(--muted);margin-top:2px;}
.stage-tag{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:12px;padding:3px 12px;border-radius:20px;font-weight:600;margin-top:6px;}
.task-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);border:1px solid var(--border);}
.task-card h4{font-size:15px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.task-card h4 .tag{background:#f1f5f9;color:#475569;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:400;}
.task-card ul{list-style:none;}
.task-card li{padding:5px 0 5px 18px;position:relative;font-size:14px;line-height:1.6;color:#334155;}
.task-card li::before{content:"▸";position:absolute;left:0;color:var(--primary);}
.mastery{font-size:13px;color:var(--success);margin-top:6px;font-weight:500;}
.tip-box{background:#fffbeb;border-left:4px solid var(--warn);border-radius:0 12px 12px 0;padding:10px 14px;margin-top:10px;font-size:13px;color:#92400e;}
.notes-area{width:100%;min-height:70px;border:1px dashed var(--border);border-radius:10px;padding:10px;font-family:inherit;font-size:13px;resize:vertical;margin-top:6px;transition:.2s;}
.notes-area:focus{outline:none;border-color:var(--primary);}
.check-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap;gap:10px;}
.check-btn{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none;-webkit-tap-highlight-color:transparent;}
.check-box{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0;}
.check-btn.checked .check-box{background:var(--success);border-color:var(--success);}
.check-btn.checked .check-box::after{content:"✓";color:#fff;font-size:14px;font-weight:700;}
.nav-group{display:flex;gap:8px;}
.nav-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;}
.nav-btn:active{background:var(--primary-light);}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* 底部导航 */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding:6px 0 env(safe-area-inset-bottom,8px);backdrop-filter:blur(10px);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted);font-size:11px;transition:.15s;-webkit-tap-highlight-color:transparent;}
.nav-item.active{color:var(--primary);}
.nav-item .icon{font-size:22px;line-height:1;}
.nav-item span{font-weight:500;}

/* 阶段页 */
.stage-list{display:flex;flex-direction:column;gap:14px;}
.stage-card{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.03);}
.stage-card h3{font-size:16px;font-weight:700;margin-bottom:4px;}
.stage-card .meta{font-size:13px;color:var(--muted);margin-bottom:6px;}
.stage-card .goal{font-size:13px;color:#475569;line-height:1.5;}
.progress-bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:.3s;}

/* 日历页 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:12px;font-weight:500;background:#f8fafc;border:1px solid var(--border);cursor:pointer;transition:.15s;position:relative;}
.cal-cell:active{background:var(--primary-light);}
.cal-cell.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.cal-cell.done{background:var(--success);color:#fff;border-color:var(--success);}
.cal-cell .dot{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--warn);}
.cal-month-label{font-size:14px;font-weight:600;margin:12px 0 6px;color:var(--text);}

/* 导入导出弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:600px;max-height:80vh;overflow:auto;}
.modal-box h3{font-size:17px;margin-bottom:8px;}
.modal-box textarea{width:100%;min-height:240px;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:monospace;font-size:12px;line-height:1.5;resize:vertical;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
.btn{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:10px;font-size:14px;cursor:pointer;transition:.15s;}
.btn:active{opacity:.8;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-sm{background:#f1f5f9;border:none;padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--text);}
.header-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.header-actions .btn-sm{background:rgba(255,255,255,.2);color:#fff;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
@media(min-width:768px){
  .container{max-width:720px;}
}
</style>
</head>
<body>

<div class="header">
  <h1>📘 90天公考执行计划</h1>
  <div class="sub">2026.07.22 起 · 联动数据</div>
  <div class="header-actions">
    <button class="btn-sm" onclick="showImport()">📥 导入JSON</button>
    <button class="btn-sm" onclick="exportJSON()">📤 导出</button>
    <button class="btn-sm" onclick="resetData()">🔄 重置</button>
  </div>
</div>

<div class="container">
  <!-- 今日任务页 -->
  <div class="page active" id="pageToday"></div>
  <!-- 阶段总览页 -->
  <div class="page" id="pageStages"></div>
  <!-- 日历页 -->
  <div class="page" id="pageCalendar"></div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="today" onclick="switchPage('today')">
    <span class="icon">📋</span><span>今日</span>
  </div>
  <div class="nav-item" data-page="stages" onclick="switchPage('stages')">
    <span class="icon">📊</span><span>阶段</span>
  </div>
  <div class="nav-item" data-page="calendar" onclick="switchPage('calendar')">
    <span class="icon">📅</span><span>日历</span>
  </div>
</div>

<!-- 导入导出弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">导入数据</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px;" id="modalHint">粘贴完整JSON后点击导入。</p>
    <textarea id="jsonArea" placeholder='{"startDate":"2026-07-22","stages":[...],"tasks":{...}}'></textarea>
    <div class="modal-actions">
      <button class="btn-outline btn" onclick="closeModal()">取消</button>
      <button class="btn" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<script>
// =============== 数据核心 ===============
const STATE = {
  startDate: "2026-07-22",
  currentDay: 1,
  stages: [
    {id:1,name:"第一阶段·基础重塑",days:"Day1-32",goal:"做对、搞懂。全程不限时。错题标K/J/S。"},
    {id:2,name:"第二阶段·强化刷题",days:"Day33-62",goal:"保持K/J/S标记习惯，逐步建立时间意识。"},
    {id:3,name:"第三阶段·冲刺稳定",days:"Day63-90",goal:"刷真题套卷，保持手感。K/J/S坚持标记到考前。"}
  ],
  tasks: {}
};

// ---------- 内置前7天示例（完整）----------
const builtinDays = [1,2,3,4,5,6,7];
builtinDays.forEach(d=>{
  STATE.tasks[d] = {
    stageId:1,
    items:[],
    tips:"",
    notes:"",
    done:false
  };
});
// Day1
STATE.tasks[1].items = [
  {tag:"行测-资料分析", lines:["翻开讲义第一课「变化」，只看公式汇总，抄在纸上背熟。合上讲义，打开小P《精选90套刷题册》资料分析部分，做对应章节题目。做完对答案，错题标K/J/S。"], mastery:"能默写四个公式，做对的题≥60%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做一道概括题（非江苏）。先独立写，再看视频对答案。写多写少不管，能写出来就算赢。"], mastery:"能写出答案，不看正确率。"},
  {tag:"常识时政", lines:["看马克时政最新一期视频，看20分钟。看完截图3个你觉得最可能考的知识点，存相册。不抄笔记。"], mastery:"今天不追求记住，只追求'看过'。"},
  {tag:"申论规范词积累", lines:["从小马哥视频的答案里，选1个比你的表达更规范的词，抄进'规范词本'。"], mastery:""},
  {tag:"复盘", lines:["建立行测错题本。不抄题，只记'日期+刷题册名称+章节+题号+K/J/S'。今天记3条试试。"], mastery:""}
];
STATE.tasks[1].tips = "第一次做不对很正常，标清楚错因就行。今天做不完没关系，明天继续。";

// Day2
STATE.tasks[2].items = [
  {tag:"行测-资料分析", lines:["翻开讲义第二课「加减与误差」，只看结论。合上讲义，打开小P《精选90套刷题册》资料分析部分，做对应章节题目。对答案+错题标K/J/S。"], mastery:"能区分什么时候估什么时候精算，做对的题≥60%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做第二道概括题（非江苏）。先独立写，再看视频对答案。今天重点关注：你写的词哪些是从材料里抄的，哪些是自己编的？"], mastery:"能区分'原词'和'自编词'。"},
  {tag:"常识时政", lines:["继续看马克时政，20分钟。翻看昨天截图的知识点，能说出大概意思就行。"], mastery:"能复述昨天3个知识点的核心词。"},
  {tag:"申论规范词积累", lines:["从今天的答案里选1个新规范词抄进本子。"], mastery:""},
  {tag:"复盘", lines:["重做Day1行测错题（只看标了K/J/S的题）。"], mastery:""}
];
STATE.tasks[2].tips = "选项差距大（10/20/30/40）就估；差距小（10.1/10.2/10.3）就硬算。别纠结，看选项差距决定。";

// Day3
STATE.tasks[3].items = [
  {tag:"行测-资料分析", lines:["翻开讲义第三课「乘除变化」，只看公式。合上讲义，打开小P《精选90套刷题册》资料分析部分，做对应章节题目。对答案+错题标K/J/S。"], mastery:"能分清增长量和增长率，做对的题≥60%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做一道分析题（非江苏）。按'现象+原因+影响'三层写。再看视频对答案。"], mastery:"能写出至少2层。"},
  {tag:"常识时政", lines:["看马克时政，20分钟。截图3个新知识点。"], mastery:""},
  {tag:"申论规范词积累", lines:["从今天分析题答案里选1个规范词抄进本子。"], mastery:""},
  {tag:"复盘", lines:["整理Day1-2申论答题要点，抄在本子上。"], mastery:""}
];
STATE.tasks[3].tips = "增长量带单位（亿元/万吨），增长率带%。题干问'增长了多少'看单位判断。";

// Day4
STATE.tasks[4].items = [
  {tag:"行测-资料分析", lines:["翻开讲义第四课「比重类问题」，只看三个公式。合上讲义，打开小P《精选90套刷题册》资料分析部分，做对应章节题目。对答案+错题标K/J/S。"], mastery:"能默写三个比重公式，做对的题≥60%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做第二道分析题（非江苏）。重点关注：你的'原因层'有没有用到材料里的原词？"], mastery:"原因分析有材料依据。"},
  {tag:"常识时政", lines:["看马克时政，20分钟。翻看前两天截图，能说出3个以上知识点的大概意思。"], mastery:""},
  {tag:"申论规范词积累", lines:["从今天答案里选1个规范词。"], mastery:""},
  {tag:"复盘", lines:["统计Day1-4的K/J/S数量，记在错题本扉页。"], mastery:""}
];
STATE.tasks[4].tips = "比重变化看'部分增长率 vs 整体增长率'，a>b则比重上升，反之下降，不用算具体数值。";

// Day5
STATE.tasks[5].items = [
  {tag:"行测-资料分析", lines:["翻开讲义第五课「分式混合」，只看平均数公式。合上讲义，打开小P《精选90套刷题册》资料分析部分，做对应章节题目。对答案+错题标K/J/S。"], mastery:"能做对平均数题，做对的题≥60%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做一道对策题（非江苏）。把所有'问题'圈出来，反推对策。写完后看视频对答案。"], mastery:"能写出至少3条对策。"},
  {tag:"常识时政", lines:["看马克时政，20分钟。"], mastery:""},
  {tag:"申论规范词积累", lines:["从今天对策题答案里选1个规范词。"], mastery:""},
  {tag:"复盘", lines:["翻看前4天申论答案，漏掉的要点用荧光笔在材料上标出来。"], mastery:""}
];
STATE.tasks[5].tips = "问'平均每…增长%'直接用 r=(a-b)/(1+b)，别绕弯硬算。";

// Day6
STATE.tasks[6].items = [
  {tag:"行测-资料分析", lines:["翻开讲义第六课「容斥问题」，只看核心结论。合上讲义，打开小P《精选90套刷题册》资料分析部分，做对应章节题目。对答案+错题标K/J/S。"], mastery:"做对的题≥60%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做第二道对策题（非江苏）。重点关注：你写的对策和答案里的对策差距在哪？"], mastery:"能写出比昨天更具体的对策。"},
  {tag:"常识时政", lines:["看马克时政，20分钟。"], mastery:""},
  {tag:"申论规范词积累", lines:["从今天答案里选1个规范词。"], mastery:""},
  {tag:"复盘", lines:["遮住答案，重做Day2-5所有标K的行测错题。"], mastery:""}
];
STATE.tasks[6].tips = "容斥考得不多，公式记住就行，不用花太多时间。";

// Day7
STATE.tasks[7].items = [
  {tag:"行测-资料分析", lines:["打开小P《精选90套刷题册》资料分析部分，做第1套完整资料分析，不限时。对答案+错题标K/J/S。"], mastery:"不限时正确率≥70%。"},
  {tag:"申论", lines:["打开B站小马哥刷题合集，做一道公文题（非江苏）。先画格式框架，再写内容。写完看视频对答案，重点检查格式。"], mastery:"格式5要素全部正确。"},
  {tag:"常识时政", lines:["看马克时政，20分钟。"], mastery:""},
  {tag:"申论规范词积累", lines:["从今天公文题答案里选1个规范词。"], mastery:""},
  {tag:"复盘", lines:["分析资料错题是公式错还是计算错，标清楚。"], mastery:""}
];
STATE.tasks[7].tips = "第一次做整篇资料分析，觉得时间长很正常。前7天就是在'热脑子'。";

// 为其余日期创建占位（Day8-90）
for(let d=8; d<=90; d++){
  const stageId = d<=32 ? 1 : d<=62 ? 2 : 3;
  STATE.tasks[d] = {
    stageId,
    items: [{tag:"待填充", lines:["请通过「导入JSON」载入完整90天计划，或手动编辑STATE.tasks["+d+"]。"], mastery:""}],
    tips: "",
    notes: "",
    done: false
  };
}

// 工具函数
function dayDate(n){
  const d=new Date(STATE.startDate);
  d.setDate(d.getDate()+n-1);
  return d.toISOString().slice(0,10);
}
function todayNum(){
  const now=new Date(), start=new Date(STATE.startDate);
  now.setHours(0,0,0,0); start.setHours(0,0,0,0);
  const diff=Math.round((now-start)/86400000)+1;
  return diff>=1&&diff<=90?diff:1;
}

// =============== 渲染引擎 ===============
function renderAll(){
  renderToday();
  renderStages();
  renderCalendar();
  saveState();
}
function renderToday(){
  const d=STATE.currentDay, task=STATE.tasks[d];
  if(!task){document.getElementById('pageToday').innerHTML='<div class="empty-state">暂无数据</div>';return;}
  const stage=STATE.stages.find(s=>s.id===task.stageId);
  const itemsHtml=task.items.map(it=>{
    const lines=it.lines.map(l=>`<li>${l}</li>`).join('');
    const mastery=it.mastery?`<div class="mastery">➤ 掌握度：${it.mastery}</div>`:'';
    return `<div class="task-card"><h4><span class="tag">${it.tag}</span></h4><ul>${lines}</ul>${mastery}</div>`;
  }).join('');
  const tipHtml=task.tips?`<div class="tip-box">💡 ${task.tips}</div>`:'';
  const checked=task.done?'checked':'';
  const prevDisabled=d<=1?'disabled':'';
  const nextDisabled=d>=90?'disabled':'';
  const html=`
    <div class="day-header">
      <div class="day-num">Day ${d}</div>
      <div class="date-info">${dayDate(d)} · ${stage?stage.name:''}</div>
      <div class="stage-tag">${stage?stage.days:''}</div>
    </div>
    ${itemsHtml}
    ${tipHtml}
    <div class="task-card">
      <h4>📝 执行备注</h4>
      <textarea class="notes-area" placeholder="记录今天执行情况、卡点、调整..." oninput="updateNotes(${d},this.value)">${task.notes||''}</textarea>
    </div>
    <div class="check-row">
      <div class="check-btn ${checked}" onclick="toggleDone(${d})">
        <span class="check-box"></span> 标记完成
      </div>
      <div class="nav-group">
        <button class="nav-btn" ${prevDisabled} onclick="gotoDay(${d-1})">← 前一天</button>
        <button class="nav-btn" ${nextDisabled} onclick="gotoDay(${d+1})">后一天 →</button>
      </div>
    </div>`;
  document.getElementById('pageToday').innerHTML=html;
}
function renderStages(){
  const html=STATE.stages.map(s=>{
    const nums=s.days.match(/\d+/g);
    const from=parseInt(nums[0]),to=parseInt(nums[1]);
    let total=0,done=0;
    for(let i=from;i<=to;i++){total++;if(STATE.tasks[i]&&STATE.tasks[i].done)done++;}
    const pct=total?Math.round(done/total*100):0;
    return `<div class="stage-card">
      <h3>${s.name}</h3>
      <div class="meta">${s.days} ｜ ${done}/${total} 天完成 (${pct}%)</div>
      <div class="goal">${s.goal}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
  document.getElementById('pageStages').innerHTML=`<h2 style="margin-bottom:16px;font-size:20px;">📊 阶段总览</h2><div class="stage-list">${html}</div>`;
}
function renderCalendar(){
  // 按月份分组
  const months={};
  for(let d=1;d<=90;d++){
    const dt=new Date(STATE.startDate);dt.setDate(dt.getDate()+d-1);
    const key=dt.getFullYear()+'-'+(dt.getMonth()+1);
    if(!months[key])months[key]=[];
    months[key].push(d);
  }
  let html='<h2 style="margin-bottom:12px;font-size:20px;">📅 日历</h2>';
  Object.keys(months).forEach(m=>{
    const parts=m.split('-');
    html+=`<div class="cal-month-label">${parts[0]}年${parts[1]}月</div><div class="cal-grid">`;
    // 填充空白
    const firstDay=new Date(parts[0],parts[1]-1,1).getDay(); // 0周日
    for(let i=0;i<firstDay;i++)html+=`<div></div>`;
    months[m].forEach(d=>{
      const t=STATE.tasks[d];
      const cls=['cal-cell'];
      if(d===STATE.currentDay)cls.push('active');
      if(t&&t.done)cls.push('done');
      const dot=(t&&t.notes&&t.notes.trim())?'<span class="dot"></span>':'';
      html+=`<div class="${cls.join(' ')}" onclick="gotoDay(${d});switchPage('today')">${d}${dot}</div>`;
    });
    html+='</div>';
  });
  document.getElementById('pageCalendar').innerHTML=html;
}

// =============== 交互函数 ===============
function switchPage(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page'+page.charAt(0).toUpperCase()+page.slice(1)).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
  // 如果切换到日历或阶段，重新渲染（确保数据最新）
  if(page==='stages')renderStages();
  if(page==='calendar')renderCalendar();
}
function gotoDay(d){
  STATE.currentDay=d;
  renderAll();
  switchPage('today');
}
function toggleDone(d){
  STATE.tasks[d].done=!STATE.tasks[d].done;
  renderAll();
}
function updateNotes(d,val){
  STATE.tasks[d].notes=val;
  saveState();
  // 仅刷新日历上的小点
  renderCalendar();
}
function saveState(){
  try{localStorage.setItem('gk90_mobile',JSON.stringify(STATE));}catch(e){}
}
function resetData(){
  if(!confirm('确定重置所有完成标记和备注？（内置任务保留）'))return;
  for(let d=1;d<=90;d++){STATE.tasks[d].done=false;STATE.tasks[d].notes='';}
  renderAll();
}
// 导入导出
function showImport(){
  document.getElementById('modalTitle').textContent='导入任务数据';
  document.getElementById('modalHint').textContent='粘贴完整JSON后点击导入。格式见示例。';
  document.getElementById('jsonArea').value='';
  document.getElementById('jsonArea').readOnly=false;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
function doImport(){
  try{
    const raw=document.getElementById('jsonArea').value.trim();
    if(!raw)throw new Error('内容为空');
    const data=JSON.parse(raw);
    if(!data.tasks||typeof data.tasks!=='object')throw new Error('缺少 tasks 字段');
    STATE.startDate=data.startDate||STATE.startDate;
    if(data.stages&&Array.isArray(data.stages))STATE.stages=data.stages;
    for(let d=1;d<=90;d++){
      if(data.tasks[d])STATE.tasks[d]=data.tasks[d];
      else if(!STATE.tasks[d]){
        const sid=d<=32?1:d<=62?2:3;
        STATE.tasks[d]={stageId:sid,items:[{tag:"待填充",lines:["未提供"],mastery:""}],tips:"",notes:"",done:false};
      }
    }
    STATE.currentDay=todayNum();
    renderAll();
    closeModal();
    alert('✅ 导入成功！共载入 '+Object.keys(data.tasks).length+' 天数据。');
  }catch(e){
    alert('❌ 导入失败：'+e.message);
  }
}
function exportJSON(){
  const out={startDate:STATE.startDate,stages:STATE.stages,tasks:STATE.tasks};
  document.getElementById('modalTitle').textContent='导出数据';
  document.getElementById('modalHint').textContent='复制下方JSON保存为 .json 文件。';
  document.getElementById('jsonArea').value=JSON.stringify(out,null,2);
  document.getElementById('jsonArea').readOnly=true;
  document.getElementById('modalOverlay').classList.add('open');
}

// =============== 初始化 ===============
(function init(){
  const saved=localStorage.getItem('gk90_mobile');
  if(saved){
    try{
      const s=JSON.parse(saved);
      if(s.tasks&&s.tasks['1']){
        STATE.startDate=s.startDate||STATE.startDate;
        if(s.stages)STATE.stages=s.stages;
        for(let d=1;d<=90;d++)if(s.tasks[d])STATE.tasks[d]=s.tasks[d];
      }
    }catch(e){console.warn('恢复存档失败');}
  }
  STATE.currentDay=todayNum();
  renderAll();
})();
</script>
</body>
